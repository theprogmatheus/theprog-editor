    <link rel="alternate icon" href="/theprog-editor/favicon.ico" />
    <link rel="shortcut icon" href="/theprog-editor/favicon.ico" />

    <meta name="description" content="TheProg Editor - IDE PWA 100% Offline com compilação e execução nativa em C e C++" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>TheProg Editor</title>
    <!-- Redirecionamento Canônico para Domínio Oficial de Produção -->
    <script>
      (function () {
        try {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
          var host = window.location.hostname.toLowerCase();
          var allowed =
            host === 'localhost' ||
            host === '127.0.0.1' ||
            host === '[::1]' ||
            host === 'matheus.eti.br' ||
            host.endsWith('.matheus.eti.br');
          if (!allowed) {
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            window.location.replace('https://matheus.eti.br/theprog-editor/' + search + hash);
          }
        } catch (e) {
          console.error('Redirection check error:', e);
        }
      })();
    </script>
  </head>
  <body class="font-sans antialiased select-none overflow-hidden h-screen w-screen m-0 p-0">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
