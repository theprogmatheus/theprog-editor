server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cabeçalhos indispensáveis para WebAssembly (SharedArrayBuffer / Atomics) e Segurança
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Redirecionamento da raiz / para /theprog-editor/
    location = / {
        return 301 /theprog-editor/;
    }

    # Roteamento SPA base /theprog-editor/
    location /theprog-editor/ {
        alias /usr/share/nginx/html/theprog-editor/;
        try_files $uri $uri/ /theprog-editor/index.html;
    }

    # Cache longo para binários WebAssembly (mantendo os headers COOP/COEP)
    location ~* \.(wasm|tar|bin|whl|zip)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache para assets estáticos com hash (mantendo os headers COOP/COEP)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=2592000";
    }
}
