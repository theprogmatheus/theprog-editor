# Bloco HTTP: Redirecionamento 301 para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name matheus.eti.br 169.58.71.100 localhost;

    # Endpoint para desafio ACME (caso utilize Certbot / Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redireciona todas as requisições HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloco HTTPS Principal com isolamento de origem cruzada para WebAssembly
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matheus.eti.br 169.58.71.100 localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Certificados SSL/TLS montados via volume Docker
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Parâmetros modernos de segurança SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Compressão Gzip para acelerar bundles do Monaco Editor e libs
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cabeçalhos indispensáveis para habilitar SharedArrayBuffer e Atomics (scanf/cin interativo)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Roteamento SPA base /theprog-editor/
    location /theprog-editor/ {
        alias /usr/share/nginx/html/theprog-editor/;
        try_files $uri $uri/ /theprog-editor/index.html;
    }

    # Redirecionamento da raiz / para /theprog-editor/
    location = / {
        return 301 /theprog-editor/;
    }

    # Cache longo para binários pesados WebAssembly e bibliotecas C/C++/Python
    location ~* \.(wasm|tar|bin|whl|zip)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache para assets estáticos com hash gerados pelo Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=2592000";
    }
}
