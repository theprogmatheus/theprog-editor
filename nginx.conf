server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos indispensáveis para habilitar SharedArrayBuffer e Atomics (scanf/cin interativo)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Roteamento SPA base /theprog-editor/
    location /theprog-editor/ {
        alias /usr/share/nginx/html/theprog-editor/;
        try_files $uri $uri/ /theprog-editor/index.html;
    }

    location / {
        return 301 /theprog-editor/;
    }

    # Cache longo para binários pesados WebAssembly e bibliotecas C/C++
    location ~* \.(wasm|tar|bin)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
