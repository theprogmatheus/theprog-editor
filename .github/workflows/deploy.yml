name: CI & Auto-Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Trigger Webhook
        run: |
          echo "🚀 Disparando build no Coolify..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Resposta do Coolify: $HTTP_BODY"
          echo "Status HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "❌ Falha ao disparar deploy no Coolify!"
            exit 1
          fi

          echo "✅ Deploy enfileirado com sucesso no Coolify!"
